name: Release candidate

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag matching Cargo.toml (for example v0.1.0)
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version and source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      revision: ${{ steps.plan.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate the tag and platform versions
        id: plan
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python scripts/release.py plan --tag "$RELEASE_TAG" --require-tag --github-output "$GITHUB_OUTPUT"

  packages:
    needs: version
    uses: ./.github/workflows/packages.yml
    with:
      ref: ${{ needs.version.outputs.revision }}

  prepare:
    name: Verify and assemble release assets
    needs: [version, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.version.outputs.revision }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ClickPulse-${{ needs.version.outputs.version }}-*
          merge-multiple: true
          path: dist
      - name: Build corresponding source archive
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          SOURCE_REVISION: ${{ needs.version.outputs.revision }}
        run: python scripts/package_github_draft.py --release --tag "$RELEASE_TAG" --revision "$SOURCE_REVISION"
      - name: Verify every package and write release notes
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          SOURCE_REVISION: ${{ needs.version.outputs.revision }}
        run: >-
          python scripts/release.py prepare --tag "$RELEASE_TAG" --revision "$SOURCE_REVISION"
          --packages dist --output dist/release --notes dist/release-notes.md
          --repository "$GITHUB_REPOSITORY" --github-summary "$GITHUB_STEP_SUMMARY"
          ${{ github.event.repository.private && '--private' || '' }}
      - name: Confirm the source tag has not moved
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          SOURCE_REVISION: ${{ needs.version.outputs.revision }}
        run: |
          revision=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          if [[ "$revision" != "$SOURCE_REVISION" ]]; then
            echo "The tag moved after validation. No candidate will be retained."
            exit 1
          fi
      - name: Retain the verified release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Release-candidate-${{ needs.version.outputs.version }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/release/*
            dist/release-notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; skipping publication."
            exit 0
          fi
          gh release create "$RELEASE_TAG" dist/release/* \
            --repo "$GH_REPO" \
            --title "ClickPulse $RELEASE_VERSION" \
            --notes-file dist/release-notes.md \
            --latest
      - name: Prepare domestic in-app update mirror
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          SOURCE_REVISION: ${{ needs.version.outputs.revision }}
        run: |
          mkdir -p dist/update-assets
          for target in windows-x64 macos-arm64 macos-x64 linux-arm64 linux-x64; do
            cp "dist/release/ClickPulse-$RELEASE_VERSION-$target.zip" "dist/release/ClickPulse-$RELEASE_VERSION-$target.manifest.json" dist/update-assets/
          done
          cp "dist/release/ClickPulse-$RELEASE_VERSION-macos-arm64.dmg" "dist/release/ClickPulse-$RELEASE_VERSION-macos-x64.dmg" dist/update-assets/
          cp dist/release/SHA256SUMS.txt dist/update-assets/
          python scripts/prepare_update_mirror.py \
            --release-dir dist/update-assets \
            --output dist/latest.json \
            --version "$RELEASE_VERSION" \
            --revision "$SOURCE_REVISION" \
            --repository "$GITHUB_REPOSITORY" \
            --changelog CHANGELOG.md
      - name: Configure update mirror SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
        run: |
          test -n "$SSH_KEY" && test -n "$SSH_HOST" && test -n "$SSH_USER"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Publish domestic in-app update mirror
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          UPDATE_ROOT='/www/wwwroot/clickpulse-data/updates'
          case "$RELEASE_VERSION" in ''|*[!0-9.]*) echo '::error::Invalid release version'; exit 1;; esac
          SSH_CMD="ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes"
          STAGING="$UPDATE_ROOT/.v$RELEASE_VERSION-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          TARGET="$UPDATE_ROOT/v$RELEASE_VERSION"
          $SSH_CMD "$SSH_USER@$SSH_HOST" "set -eu; mkdir -p '$UPDATE_ROOT'; test ! -e '$STAGING'; mkdir '$STAGING'"
          rsync -a --partial --timeout=300 -e "$SSH_CMD" dist/update-assets/ "$SSH_USER@$SSH_HOST:$STAGING/"
          rsync -a --partial --timeout=300 -e "$SSH_CMD" dist/latest.json "$SSH_USER@$SSH_HOST:$UPDATE_ROOT/.latest-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          $SSH_CMD "$SSH_USER@$SSH_HOST" "set -eu; if [ -d '$TARGET' ]; then rm -rf '$STAGING'; else mv '$STAGING' '$TARGET'; fi; mv '$UPDATE_ROOT/.latest-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json' '$UPDATE_ROOT/latest.json'"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            'https://clickpulse.fangdutex.cn/api/v1/updates/latest' > published-latest.json
          python - <<'PY'
          import json, os
          with open('published-latest.json', encoding='utf-8') as handle:
              metadata = json.load(handle)
          expected = f"v{os.environ['RELEASE_VERSION']}"
          actual = metadata.get('tag_name')
          if actual != expected:
              raise SystemExit(f'published update metadata reports {actual!r}, expected {expected!r}')
          PY
      - name: Clean up mirror key
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/deploy_key.pub
